<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a12">
  <title>Fitness · SupTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">

    <!-- Loading screen -->
    <div id="loading-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <div style="text-align:center;">
        <h1 class="logo" style="font-size:28px;margin-bottom:8px;">Fitness</h1>
        <p style="color:var(--text-muted);font-size:13px;">Loading...</p>
      </div>
    </div>

    <!-- Header -->
    <header id="app-header" style="display:none;">
      <a href="index.html" class="header-home-btn" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <h1 class="logo" style="font-size:18px;">Fitness</h1>
      <span></span>
    </header>

    <!-- Mode tabs (Weight | Workouts) -->
    <div id="fitness-mode-tabs" style="display:none;">
      <button class="fitness-mode-tab active" data-mode="weight" onclick="switchFitnessMode('weight')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Weight
      </button>
      <button class="fitness-mode-tab" data-mode="workouts" onclick="switchFitnessMode('workouts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 8v8M18 8v8M2 12h4M18 12h4M8 6h8v12H8z"/></svg>
        Workouts
      </button>
    </div>

    <!-- Weight sub-tab bar -->
    <div id="fitness-tabs" style="display:none;">
      <button class="fitness-tab active" data-tab="log" onclick="switchFitnessTab('log')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Log
      </button>
      <button class="fitness-tab" data-tab="calendar" onclick="switchFitnessTab('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
      <button class="fitness-tab" data-tab="graph" onclick="switchFitnessTab('graph')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Graph
      </button>
    </div>

    <!-- Workout sub-tab bar -->
    <div id="workout-tabs" style="display:none;">
      <button class="fitness-tab workout-tab active" data-wtab="today" onclick="W.switchView('today')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
        Today
      </button>
      <button class="fitness-tab workout-tab" data-wtab="splits" onclick="W.switchView('splits')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Splits
      </button>
      <button class="fitness-tab workout-tab" data-wtab="history" onclick="W.switchView('history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        History
      </button>
      <button class="fitness-tab workout-tab" data-wtab="consistency" onclick="W.switchView('consistency')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
    </div>

    <!-- Main content -->
    <main id="main-content" style="display:none;">

      <!-- Weight mode views -->
      <div id="weight-mode">
        <!-- Log view -->
        <section id="view-log" class="view active" style="padding:16px 20px;">
          <div id="weight-log-form"></div>
          <div id="today-entries"></div>
          <div id="weight-history"></div>
        </section>

        <!-- Calendar view -->
        <section id="view-calendar" class="view"></section>

        <!-- Graph view -->
        <section id="view-graph" class="view"></section>
      </div>

      <!-- Workout mode view -->
      <div id="workout-mode" style="display:none;">
        <section id="view-wt-content"></section>
      </div>

    </main>

  </div>

  <script src="fitness.js"></script>
  <script src="workout.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
