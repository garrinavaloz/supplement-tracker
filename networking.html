<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a12">
  <title>Networking · SupTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">

    <div id="loading-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <div style="text-align:center;">
        <h1 class="logo" style="font-size:28px;margin-bottom:8px;">Networking</h1>
        <p style="color:var(--text-muted);font-size:13px;">Loading...</p>
      </div>
    </div>

    <header id="app-header" style="display:none;">
      <a href="index.html" class="header-home-btn" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <h1 class="logo" style="font-size:18px;">Networking</h1>
      <span></span>
    </header>

    <div id="net-tabs" style="display:none;">
      <button class="net-tab active" data-tab="contacts" onclick="App.switchTab('contacts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Contacts
      </button>
      <button class="net-tab" data-tab="tocontact" onclick="App.switchTab('tocontact')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.08 1.18 2 2 0 012.07 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        To Contact
      </button>
    </div>

    <main id="main-content" style="display:none;">
      <section id="view-contacts" class="view active" style="padding:16px 20px;">
        <div class="empty-state"><p>Loading...</p></div>
      </section>
      <section id="view-tocontact" class="view" style="padding:16px 20px;">
        <div class="empty-state"><p>Loading...</p></div>
      </section>
      <section id="view-detail" class="view" style="padding:16px 20px;">
        <div id="detail-content"></div>
      </section>
    </main>

    <div id="modal-overlay" class="modal-overlay" onclick="App.closeModal()"></div>
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn-icon modal-close" onclick="App.closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>

  </div>
  <script src="networking.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
