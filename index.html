<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a12">
  <title>SupTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div id="app">

    <!-- Loading screen -->
    <div id="loading-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <div style="text-align:center;">
        <h1 class="logo" style="font-size:28px;margin-bottom:8px;">SupTrack</h1>
        <p style="color:var(--text-muted);font-size:13px;">Loading...</p>
      </div>
    </div>

    <!-- Header -->
    <header id="app-header" style="display:none;">
      <h1 class="logo">SupTrack</h1>
      <span class="header-date" id="header-date"></span>
      <button onclick="Auth.signOut()" style="background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:4px 8px;">Sign out</button>
    </header>

    <!-- Main content -->
    <main id="main-content" style="display:none;">
      <section style="padding:16px 20px;">

        <!-- Greeting -->
        <div class="home-greeting">
          <p id="greeting-text" class="home-greeting-text"></p>
          <p id="greeting-sub" class="home-greeting-sub"></p>
        </div>

        <!-- Reminders -->
        <div class="home-section">
          <div class="home-section-header">
            <span class="home-section-label">TODAY'S REMINDERS</span>
            <a href="reminders.html" class="home-section-link">View all</a>
          </div>
          <div id="reminders-list"></div>
        </div>

        <!-- Navigation -->
        <div class="home-section">
          <div class="home-section-header">
            <span class="home-section-label">SECTIONS</span>
          </div>
          <div class="home-nav-grid">

            <a href="supplements.html" class="home-nav-card">
              <div class="home-nav-icon" style="background:var(--accent-dim);color:var(--accent);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg>
              </div>
              <div class="home-nav-info">
                <span class="home-nav-name">Supplements</span>
                <span class="home-nav-desc">Track daily intake &amp; cycles</span>
              </div>
              <svg class="home-nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </a>

            <a href="reminders.html" class="home-nav-card">
              <div class="home-nav-icon" style="background:var(--accent-blue-dim);color:var(--accent-blue);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
              </div>
              <div class="home-nav-info">
                <span class="home-nav-name">Reminders</span>
                <span class="home-nav-desc">Custom alerts &amp; tasks</span>
              </div>
              <svg class="home-nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </a>

            <a href="fitness.html" class="home-nav-card">
              <div class="home-nav-icon" style="background:rgba(251,191,36,0.15);color:var(--warning);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M6 5v14M18 5v14M6 12h12M3 8h3M3 16h3M18 8h3M18 16h3"/></svg>
              </div>
              <div class="home-nav-info">
                <span class="home-nav-name">Fitness</span>
                <span class="home-nav-desc">Workouts &amp; progress</span>
              </div>
              <svg class="home-nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </a>

            <a href="networking.html" class="home-nav-card">
              <div class="home-nav-icon" style="background:rgba(167,139,250,0.15);color:#a78bfa;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
              </div>
              <div class="home-nav-info">
                <span class="home-nav-name">Networking</span>
                <span class="home-nav-desc">People &amp; relationships</span>
              </div>
              <svg class="home-nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </a>

          </div>
        </div>

      </section>
    </main>

  </div>

  <script src="home.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
