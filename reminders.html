<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a12">
  <title>Reminders · SupTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div id="app">

    <!-- Loading screen -->
    <div id="loading-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <div style="text-align:center;">
        <h1 class="logo" style="font-size:28px;margin-bottom:8px;">Reminders</h1>
        <p style="color:var(--text-muted);font-size:13px;">Loading...</p>
      </div>
    </div>

    <!-- Header -->
    <header id="app-header" style="display:none;">
      <a href="index.html" class="header-home-btn" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <h1 class="logo" style="font-size:18px;">Reminders</h1>
      <span></span>
    </header>

    <!-- Sub-tab bar -->
    <div id="reminders-tabs" style="display:none;">
      <button class="reminders-tab active" data-tab="active" onclick="App.switchTab('active')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        Active
      </button>
      <button class="reminders-tab" data-tab="calendar" onclick="App.switchTab('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </button>
      <button class="reminders-tab" data-tab="standing" onclick="App.switchTab('standing')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Standing
      </button>
    </div>

    <!-- Main content -->
    <main id="main-content" style="display:none;">

      <!-- Active view -->
      <section id="view-active" class="view active" style="padding:16px 20px;">
        <div class="empty-state"><p>Loading...</p></div>
      </section>

      <!-- Calendar view -->
      <section id="view-calendar" class="view" style="padding:16px 20px;">
        <div class="empty-state"><p>Loading...</p></div>
      </section>

      <!-- Standing view -->
      <section id="view-standing" class="view" style="padding:16px 20px;">
        <div class="empty-state"><p>Loading...</p></div>
      </section>

      <!-- Detail view -->
      <section id="view-detail" class="view" style="padding:16px 20px;">
        <div id="detail-content"></div>
      </section>

    </main>

    <!-- Modal overlay -->
    <div id="modal-overlay" class="modal-overlay" onclick="App.closeModal()"></div>
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn-icon modal-close" onclick="App.closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>

  </div>

  <script src="reminders.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
